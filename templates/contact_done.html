<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact queue clear</title>
<style>
  :root {
    --ground:   #F4F6F5;
    --surface:  #FFFFFF;
    --ink:      #1B2422;
    --muted:    #6C7A76;
    --rule:     #DCE2E0;
    --go:       #14584A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 0 1rem 4rem;
    background: var(--ground);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.45;
  }

  .wrap { max-width: 640px; margin: 0 auto; }

  .topbar {
    padding: 1.2rem 0;
    font-size: 0.9rem;
    display: flex;
    gap: 1.2rem;
  }
  .topbar a { color: var(--muted); text-decoration: none; }
  .topbar a:hover { color: var(--go); }

  .state {
    margin-top: 2rem;
    background: var(--surface);
    border: 1px solid var(--rule);
    border-left: 4px solid var(--go);
    padding: 1.6rem 1.5rem;
  }

  .state h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.4rem; }
  .state p  { margin: 0; color: var(--muted); }

  :focus-visible { outline: 2px solid var(--go); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">

  <nav class="topbar">
    <a href="/contact">Contact queue</a>
    <a href="/enrich">Lookups</a>
    <a href="/import">Import</a>
    <a href="/find">Find</a>
  </nav>

  <div class="state">
    <h1>Nobody is due today</h1>
    <p>Every open decline line is scheduled for a future date. Customers reappear here on their
       own as those dates come around.</p>
  </div>

</div>
</body>
</html>
